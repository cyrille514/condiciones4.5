<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
  </script>

  <style type="text/tailwindcss">
    @import "tailwindcss"; 

 @layer base {
      button {
        @apply rounded-md bg-slate-200 border-1 border-slate-400  px-4 py-1 my-5 mx-5 text-sm cursor-pointer disabled:opacity-50
      }

    }
    
  </style>
    <title>las condiciones4.4</title>
</head>
<body class="bg-yellow-400 min-h-screen flex items-center justify-center p-4">
    <div class="border bg-gray-100 py-16 px-14  rounded-lg max-w-md w-full text-center justify-center ">  
            <div class=" flex text-center justify-center py-4 ">  
            <label  class="flex-1" for="numero">Introduce primer número:</label>
            <input class="border-2" type="number" id="num1" placeholder="Primer número" required>
            </div>

            <div class=" flex text-center justify-center py-4 ">  
            <label  class="flex-1" for="numero">Introduce segundo número:</label>
            <input class="border-2"  type="number" id="num2" placeholder="Segundo número" required>
            </div>

            <p>
            <select class="border-2"  id="operador">
               <option value="+">Suma</option>
               <option value="-">Resta</option>
               <option value="*">Multiplicar</option>
               <option value="/">Dividir</option>
            </select> 
            </p>
            
            <button type="button" onclick="calcular()">Calcular</button>
           
            <p id="resultado"></p>
    </div>  
     <script src="./js/app.js"></script>   
</body>
</html>
